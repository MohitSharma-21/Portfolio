<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="100%" style="stop-color:#131320"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="220" fill="url(#bg1)" rx="12"/>

  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff08"/>
  </pattern>
  <rect width="600" height="220" fill="url(#dots)" rx="12"/>

  <!-- Photo grid cards -->
  <!-- Row 1 -->
  <rect x="30" y="30" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>
  <rect x="116" y="30" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>
  <rect x="202" y="30" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="30" y="116" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>
  <rect x="116" y="116" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>
  <rect x="202" y="116" width="72" height="72" rx="8" fill="#1a1a2e" stroke="#6366f130" stroke-width="1"/>

  <!-- Person silhouettes inside photos -->
  <!-- Photo 1 person -->
  <circle cx="66" cy="56" r="10" fill="#6366f140"/>
  <path d="M46 86 Q46 72 66 72 Q86 72 86 86" fill="#6366f140"/>

  <!-- Photo 2 person -->
  <circle cx="152" cy="56" r="10" fill="#a855f740"/>
  <path d="M132 86 Q132 72 152 72 Q172 72 172 86" fill="#a855f740"/>

  <!-- Photo 3 person -->
  <circle cx="238" cy="56" r="10" fill="#6366f140"/>
  <path d="M218 86 Q218 72 238 72 Q258 72 258 86" fill="#6366f140"/>

  <!-- Photo 4 person -->
  <circle cx="66" cy="142" r="10" fill="#a855f740"/>
  <path d="M46 172 Q46 158 66 158 Q86 158 86 172" fill="#a855f740"/>

  <!-- Photo 5 person (highlighted with face detection box) -->
  <circle cx="152" cy="142" r="10" fill="#6366f1"/>
  <path d="M132 172 Q132 158 152 158 Q172 158 172 172" fill="#6366f140"/>

  <!-- Photo 6 person -->
  <circle cx="238" cy="142" r="10" fill="#6366f140"/>
  <path d="M218 172 Q218 158 238 158 Q258 158 258 172" fill="#6366f140"/>

  <!-- Face detection box on photo 5 -->
  <rect x="126" y="120" width="80" height="80" rx="8" fill="none" stroke="#6366f1" stroke-width="2" filter="url(#glow1)"/>
  <!-- Corner brackets -->
  <path d="M126 136 L126 120 L142 120" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190 120 L206 120 L206 136" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M126 184 L126 200 L142 200" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M190 200 L206 200 L206 184" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Label tag on detected face -->
  <rect x="130" y="115" width="42" height="14" rx="4" fill="#6366f1"/>
  <text x="151" y="125" font-family="monospace" font-size="8" fill="white" text-anchor="middle" font-weight="bold">MATCH</text>

  <!-- Right panel: Auth / JWT section -->
  <rect x="310" y="30" width="260" height="160" rx="10" fill="#111118" stroke="#6366f120" stroke-width="1"/>

  <!-- Auth header -->
  <rect x="310" y="30" width="260" height="36" rx="10" fill="#6366f115"/>
  <rect x="310" y="54" width="260" height="12" rx="0" fill="#6366f115"/>

  <!-- Lock icon -->
  <rect x="326" y="44" width="18" height="14" rx="3" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M330 44 L330 40 Q335 35 340 40 L340 44" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="335" cy="51" r="2" fill="#6366f1"/>

  <text x="354" y="54" font-family="monospace" font-size="11" fill="#6366f1" font-weight="bold">JWT Auth</text>

  <!-- Token display -->
  <text x="326" y="82" font-family="monospace" font-size="7" fill="#6366f170">eyJhbGciOiJIUzI1NiIsInR5...</text>
  <text x="326" y="96" font-family="monospace" font-size="7" fill="#a855f770">eyJ1c2VyIjoibW9oaXQiLCJyb...</text>
  <text x="326" y="110" font-family="monospace" font-size="7" fill="#6366f170">SflKxwRJSMeKKF2QT4fwpMeJf...</text>

  <!-- Divider -->
  <line x1="326" y1="120" x2="554" y2="120" stroke="#ffffff08" stroke-width="1"/>

  <!-- Folder icons row -->
  <!-- Personal folder -->
  <path d="M326 135 L326 165 L355 165 L355 140 L345 140 L342 135 Z" fill="#6366f120" stroke="#6366f140" stroke-width="1"/>
  <text x="340" y="175" font-family="sans-serif" font-size="8" fill="#6366f180" text-anchor="middle">Personal</text>

  <!-- Group folder -->
  <path d="M370 135 L370 165 L399 165 L399 140 L389 140 L386 135 Z" fill="#a855f720" stroke="#a855f740" stroke-width="1"/>
  <text x="384" y="175" font-family="sans-serif" font-size="8" fill="#a855f780" text-anchor="middle">Groups</text>

  <!-- Events folder -->
  <path d="M414 135 L414 165 L443 165 L443 140 L433 140 L430 135 Z" fill="#6366f120" stroke="#6366f140" stroke-width="1"/>
  <text x="428" y="175" font-family="sans-serif" font-size="8" fill="#6366f180" text-anchor="middle">Events</text>

  <!-- MongoDB icon area -->
  <rect x="456" y="132" width="88" height="36" rx="6" fill="#00ed6415" stroke="#00ed6430" stroke-width="1"/>
  <text x="500" y="148" font-family="monospace" font-size="8" fill="#00ed64" text-anchor="middle" font-weight="bold">MongoDB</text>
  <text x="500" y="161" font-family="monospace" font-size="7" fill="#00ed6470" text-anchor="middle">CRUD ops</text>

  <!-- Tech labels at bottom -->
  <text x="326" y="198" font-family="monospace" font-size="8" fill="#6366f160">Next.js · Node.js · Face-api.js · MongoDB</text>
</svg>
